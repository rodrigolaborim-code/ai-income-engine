<!DOCTYPE html>
<html lang="pt" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia de Automação & IA | E-books Master & Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        code, pre { font-family: 'JetBrains Mono', monospace; }
        .markdown-body pre { background-color: #0f172a; padding: 1.25rem; border-radius: 0.75rem; overflow-x: auto; color: #38bdf8; margin: 1.5rem 0; border: 1px solid #1e293b; }
        .markdown-body h2 { font-size: 1.5rem; font-weight: bold; margin-top: 2rem; margin-bottom: 0.75rem; color: #f8fafc; border-bottom: 1px solid #1e293b; padding-bottom: 0.5rem; }
        .markdown-body h3 { font-size: 1.25rem; font-weight: 600; margin-top: 1.5rem; margin-bottom: 0.5rem; color: #e2e8f0; }
        .markdown-body p { margin-bottom: 1.25rem; line-height: 1.8; color: #cbd5e1; }
        .markdown-body ul, .markdown-body ol { padding-left: 1.5rem; margin-bottom: 1.25rem; color: #cbd5e1; }
        .markdown-body li { margin-bottom: 0.5rem; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased flex flex-col">

    <!-- HEADER -->
    <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-30 px-6 py-4">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">⚡</span>
                <h1 class="text-lg font-bold tracking-tight text-white">Academia IA & Automação</h1>
            </div>
            <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                <span class="w-2 h-2 mr-2 bg-emerald-400 rounded-full animate-pulse"></span>
                Área de Membros Ativa
            </span>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-6 md:p-10 flex-1 w-full">
        <!-- VISTA DE LISTA DE E-BOOKS -->
        <div id="listView">
            <div class="mb-8">
                <h2 class="text-3xl font-extrabold text-white tracking-tight">Biblioteca de E-books Master</h2>
                <p class="text-slate-400 mt-2">Manuais técnicos completos e compilações avançadas criadas autonomamente pelas IAs.</p>
            </div>
            <div id="ebooks-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Preenchido via JavaScript -->
                <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 animate-pulse">
                    <div class="h-4 bg-slate-800 rounded w-1/3 mb-4"></div>
                    <div class="h-6 bg-slate-800 rounded w-3/4 mb-2"></div>
                    <div class="h-4 bg-slate-800 rounded w-full"></div>
                </div>
            </div>
        </div>

        <!-- VISTA DE LEITURA DO E-BOOK COMPLETO -->
        <div id="readerView" class="hidden">
            <button onclick="backToList()" class="mb-6 inline-flex items-center text-sm font-semibold text-emerald-400 hover:text-emerald-300 transition cursor-pointer">
                ← Voltar à Biblioteca de E-books
            </button>
            <article class="bg-slate-900/90 border border-slate-800 rounded-2xl p-8 md:p-12 shadow-2xl">
                <div class="flex items-center space-x-3 text-xs font-semibold text-emerald-400 uppercase tracking-wider mb-3">
                    <span id="reader-badge">E-book Master Compilado</span>
                    <span>•</span>
                    <span id="reader-time"></span>
                </div>
                <h2 id="reader-title" class="text-3xl md:text-4xl font-extrabold text-white mb-8 leading-tight"></h2>
                <div id="reader-content" class="text-slate-300 leading-relaxed space-y-4 text-base md:text-lg markdown-body">
                    <!-- Conteúdo completo do E-book -->
                </div>
            </article>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500 mt-auto">
        Cyber Office // Motor de Renda Autónomo
    </footer>

    <script>
        let allEbooks = [];

        async function loadPortal() {
            try {
                const res = await fetch('/api/data');
                const data = await res.json();
                
                if (data.contents && data.contents.length > 0) {
                    allEbooks = data.contents;
                    const grid = document.getElementById('ebooks-grid');
                    grid.innerHTML = '';
                    
                    allEbooks.forEach((item, index) => {
                        let rawContent = item.conteudo;
                        if (typeof rawContent === 'object' && rawContent !== null) {
                            rawContent = JSON.stringify(rawContent, null, 2);
                        } else if (!rawContent) {
                            rawContent = "Sem conteúdo detalhado disponível.";
                        }

                        const cleanSnippet = rawContent.replace(/#{1,6}\s?/g, '').substring(0, 140) + '...';
                        const ebookNum = allEbooks.length - index;
                        
                        grid.innerHTML += `
                            <div onclick="openEbook('${item.id}')" class="group bg-slate-900/80 border border-slate-800/80 rounded-2xl p-6 hover:border-emerald-500/50 hover:bg-slate-900 transition cursor-pointer flex flex-col justify-between shadow-lg">
                                <div>
                                    <div class="flex justify-between items-center mb-3">
                                        <span class="text-xs font-bold text-emerald-400 uppercase tracking-wider">E-book Master #${ebookNum}</span>
                                        <span class="text-xs text-slate-500">${item.hora || 'Hoje'}</span>
                                    </div>
                                    <h3 class="text-xl font-bold text-white group-hover:text-emerald-400 transition mb-2">${item.titulo || 'E-book Técnico'}</h3>
                                    <p class="text-slate-400 text-sm leading-relaxed">${cleanSnippet}</p>
                                </div>
                                <div class="mt-6 pt-4 border-t border-slate-800/80 flex items-center justify-between text-xs font-semibold text-emerald-400">
                                    <span>📖 Ler E-book Completo →</span>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    document.getElementById('ebooks-grid').innerHTML = `
                        <div class="col-span-full py-12 text-center text-slate-500 bg-slate-900/40 rounded-2xl border border-slate-800">
                            Ainda não existem e-books compilados. A IA está a preparar o próximo volume técnico.
                        </div>
                    `;
                }
            } catch (e) {
                console.error("Erro ao carregar portal:", e);
            }
        }

        function openEbook(id) {
            const ebook = allEbooks.find(e => e.id === id);
            if (!ebook) return;

            let rawContent = ebook.conteudo;
            if (typeof rawContent === 'object' && rawContent !== null) {
                rawContent = JSON.stringify(rawContent, null, 2);
            } else if (!rawContent) {
                rawContent = "Sem conteúdo disponível.";
            }

            document.getElementById('reader-title').innerText = ebook.titulo || 'E-book Master';
            document.getElementById('reader-badge').innerText = ebook.tipo || 'E-book Master Compilado';
            document.getElementById('reader-time').innerText = `Compilado às ${ebook.hora || 'Hoje'}`;
            
            document.getElementById('reader-content').innerHTML = marked.parse(rawContent);

            document.getElementById('listView').classList.add('hidden');
            document.getElementById('readerView').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function backToList() {
            document.getElementById('readerView').classList.add('hidden');
            document.getElementById('listView').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        loadPortal();
        setInterval(loadPortal, 30000);
    </script>
</body>
</html>

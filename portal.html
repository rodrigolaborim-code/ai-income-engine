<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia de Automação & IA | Portal do Aluno</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">
    <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-30 px-6 py-4">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">⚡</span>
                <h1 class="text-lg font-bold tracking-tight text-white">Academia IA & Automação</h1>
            </div>
            <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                <span class="w-2 h-2 mr-2 bg-emerald-400 rounded-full animate-pulse"></span>
                Área de Alunos Ativa
            </span>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-6 md:p-10">
        <!-- Vista de Lista -->
        <div id="listView">
            <div class="mb-8">
                <h2 class="text-3xl font-extrabold text-white tracking-tight">Trilho de Cursos & Módulos</h2>
                <p class="text-slate-400 mt-2">Clica em qualquer módulo para aceder ao conteúdo passo a passo e guias práticos.</p>
            </div>
            <div id="modules-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Preenchido via JavaScript -->
            </div>
        </div>

        <!-- Vista de Leitura da Aula -->
        <div id="readerView" class="hidden">
            <button onclick="backToList()" class="mb-6 inline-flex items-center text-sm font-semibold text-emerald-400 hover:text-emerald-300 transition cursor-pointer">
                ← Voltar à Lista de Módulos
            </button>
            <article class="bg-slate-900/90 border border-slate-800 rounded-2xl p-8 md:p-12 shadow-2xl">
                <div class="flex items-center space-x-3 text-xs font-semibold text-emerald-400 uppercase tracking-wider mb-3">
                    <span id="reader-badge">Módulo Prático</span>
                    <span>•</span>
                    <span id="reader-time"></span>
                </div>
                <h2 id="reader-title" class="text-3xl md:text-4xl font-extrabold text-white mb-6 leading-tight"></h2>
                <div id="reader-content" class="text-slate-300 leading-relaxed space-y-4 text-base md:text-lg">
                </div>
            </article>
        </div>
    </main>

    <script>
        let allModules = [];

        async function loadPortal() {
            try {
                const res = await fetch('/api/data');
                const data = await res.json();
                
                if (data.contents && data.contents.length > 0) {
                    allModules = data.contents;
                    const grid = document.getElementById('modules-grid');
                    grid.innerHTML = '';
                    
                    allModules.forEach((item, index) => {
                        // Garante conversão segura para evitar [object Object]
                        let rawContent = item.conteudo;
                        if (typeof rawContent === 'object' && rawContent !== null) {
                            rawContent = JSON.stringify(rawContent, null, 2);
                        } else if (!rawContent) {
                            rawContent = "Sem conteúdo detalhado disponível.";
                        }

                        const cleanSnippet = rawContent.replace(/#{1,6}\s?/g, '').substring(0, 130) + '...';
                        const safeTitle = (item.titulo || 'Módulo sem título').replace(/'/g, "\\'");
                        
                        grid.innerHTML += `
                            <div onclick="openModule('${item.id}')" class="group bg-slate-900/80 border border-slate-800/80 rounded-2xl p-6 hover:border-emerald-500/50 hover:bg-slate-900 transition cursor-pointer flex flex-col justify-between shadow-lg">
                                <div>
                                    <div class="flex justify-between items-center mb-3">
                                        <span class="text-xs font-bold text-emerald-400 uppercase tracking-wider">Módulo 0${index + 1}</span>
                                        <span class="text-xs text-slate-500">${item.hora || 'Hoje'}</span>
                                    </div>
                                    <h3 class="text-xl font-bold text-white group-hover:text-emerald-400 transition mb-2">${item.titulo || 'Módulo'}</h3>
                                    <p class="text-slate-400 text-sm leading-relaxed">${cleanSnippet}</p>
                                </div>
                                <div class="mt-6 pt-4 border-t border-slate-800/80 flex items-center justify-between text-xs font-semibold text-emerald-400">
                                    <span>Aceder à Aula Passo a Passo →</span>
                                </div>
                            </div>
                        `;
                    });
                }
            } catch (e) {
                console.error("Erro ao carregar portal:", e);
            }
        }

        function openModule(id) {
            const mod = allModules.find(m => m.id === id);
            if (!mod) return;

            let rawContent = mod.conteudo;
            if (typeof rawContent === 'object' && rawContent !== null) {
                rawContent = JSON.stringify(rawContent, null, 2);
            } else if (!rawContent) {
                rawContent = "Sem conteúdo disponível.";
            }

            document.getElementById('reader-title').innerText = mod.titulo || 'Aula';
            document.getElementById('reader-badge').innerText = mod.tipo || 'Módulo Prático';
            document.getElementById('reader-time').innerText = `Atualizado às ${mod.hora || 'Hoje'}`;
            
            document.getElementById('reader-content').innerHTML = marked.parse(rawContent);

            document.getElementById('listView').classList.add('hidden');
            document.getElementById('readerView').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function backToList() {
            document.getElementById('readerView').classList.add('hidden');
            document.getElementById('listView').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        loadPortal();
        setInterval(loadPortal, 30000);
    </script>
</body>
</html>
